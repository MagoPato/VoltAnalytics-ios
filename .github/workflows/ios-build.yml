name: Compilar IPA iOS (sin firmar)

on:
  workflow_dispatch: # botón "Run workflow" en la pestaña Actions
  push:
    branches: [main]
    paths-ignore:
      - 'android/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generar proyecto Xcode (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar (sin firma)
        run: |
          xcodebuild \
            -project VoltAnalytics.xcodeproj \
            -scheme VoltAnalytics \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet \
            build

      - name: Empaquetar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VoltAnalytics.app Payload/
          zip -qry app-sin-firmar.ipa Payload
          ls -lh app-sin-firmar.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ipa-sin-firmar
          path: app-sin-firmar.ipa
          retention-days: 14

      - name: Publicar en Releases (descarga directa)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: VoltAnalytics (última compilación)
          files: app-sin-firmar.ipa
          make_latest: true
          overwrite_files: true
