name: Compilar IPA iOS (sin firmar)

on:
  workflow_dispatch: # botón "Run workflow" en la pestaña Actions
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: |
          npm install
          npx expo install --fix

      - name: Generar proyecto nativo iOS
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Instalar CocoaPods
        working-directory: ios
        run: pod install

      - name: Compilar (sin firma)
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE  Scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet \
            build

      - name: Empaquetar .ipa
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qry app-sin-firmar.ipa Payload
          ls -lh app-sin-firmar.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ipa-sin-firmar
          path: app-sin-firmar.ipa
          retention-days: 14
